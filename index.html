
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindShift Manifest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui','-apple-system','Segoe UI','Roboto','Ubuntu','Cantarell','Noto Sans','Helvetica Neue','Arial','sans-serif'],
            serif: ['Georgia','Times New Roman','serif'],
          },
        },
      },
    }
  </script>
  <script>
    (function() {
      function apply(mode) {
        document.documentElement.classList.remove('dark','light');
        document.documentElement.classList.add(mode);
      }
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const saved = localStorage.getItem('theme');
      const initial = saved ? saved : (prefersDark ? 'dark' : 'light');
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => apply(initial), { once: true });
      } else {
        apply(initial);
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        const currentSaved = localStorage.getItem('theme');
        if (!currentSaved) apply(e.matches ? 'dark' : 'light');
      });
      window.toggleTheme = function() {
        const isDark = document.documentElement.classList.contains('dark');
        const next = isDark ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        apply(next);
      }
    })();
  </script>
  
  <style>
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .glass-card {
      background-color: rgba(255,255,255,0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(15,23,42,0.12);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .dark .glass-card { background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); box-shadow: none; }
    .soft-glow-purple {
      box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.15);
    }
    .dark .soft-glow-purple {
      box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.3);
    }
    /* Hide scrollbar but keep functionality */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0a0a0c] dark:text-gray-100 min-h-screen transition-theme">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
